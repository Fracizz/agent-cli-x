name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: agent-cli-x-${{ github.ref_name }}-x86_64-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: agent-cli-x-${{ github.ref_name }}-x86_64-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # 优先用发行版包；runner 到 ubuntu 归档源的 DNS 偶发故障时快速失败，
      # 交给下面的 docker 兜底，避免卡在 apt 重试上十几分钟。
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          if command -v musl-gcc >/dev/null 2>&1; then exit 0; fi
          # 先探测 DNS，解析不了就别在 apt 上耗时间
          if timeout 10 getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            sudo timeout 90 apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 update || true
            sudo timeout 150 apt-get install -y --no-install-recommends \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 \
              musl-tools || true
          else
            echo "runner 无法解析 ubuntu 归档源，跳过 apt"
          fi
          command -v musl-gcc >/dev/null 2>&1 && echo "musl-gcc ready" || echo "musl-gcc unavailable, will use cross image"
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build (Linux musl)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v musl-gcc >/dev/null 2>&1; then
            CC_x86_64_unknown_linux_musl=musl-gcc \
              cargo build --locked --release --target ${{ matrix.target }}
          else
            # cross 镜像只提供 musl 交叉工具链，Rust 工具链仍然挂载 runner 上已装好的那份
            docker run --rm \
              -v "$PWD":/project -w /project \
              -v "$HOME/.cargo":/cargo -v "$HOME/.rustup":/rustup \
              -e CARGO_HOME=/cargo -e RUSTUP_HOME=/rustup \
              --entrypoint /cargo/bin/cargo \
              ghcr.io/cross-rs/${{ matrix.target }}:edge \
              build --locked --release --target ${{ matrix.target }}
            sudo chown -R "$(id -u):$(id -g)" target
          fi
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" agent-cli-x
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/agent-cli-x.exe" -DestinationPath "${{ matrix.archive }}"
          # 用 LF 行尾：Out-File 写的 CRLF 会让 Linux 上的 `sha256sum -c` 把 \r 当成文件名的一部分
          $hash = (Get-FileHash -Algorithm SHA256 '${{ matrix.archive }}').Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/${{ matrix.archive }}.sha256", "$hash  ${{ matrix.archive }}`n")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          heading = f"## {version}\n"
          path = Path("CHANGELOG.md")
          changelog = path.read_text() if path.exists() else ""
          if heading in changelog:
              notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          else:
              notes = f"Release {tag} of agent-cli-x."
          notes += (
              f"\n\nDownloads:\n\n"
              f"- `agent-cli-x-{tag}-x86_64-linux-musl.tar.gz` — Linux x86_64, statically linked.\n"
              f"- `agent-cli-x-{tag}-x86_64-windows-msvc.zip` — Windows x86_64.\n\n"
              "Unpack the archive and put `agent-cli-x` (`agent-cli-x.exe` on Windows) on your `PATH`. "
              "Each archive has a `.sha256` checksum file.\n"
          )
          Path("release-notes.md").write_text(notes)
          PY
          # 标签带 `-`（如 v0.0.5-beta.1）时发布为预发布版本，不会成为 latest
          extra=()
          case "${{ github.ref_name }}" in
            *-*) extra=(--prerelease) ;;
          esac
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "agent-cli-x ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag "${extra[@]}"
