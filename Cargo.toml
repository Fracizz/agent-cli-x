[package]
name = "agent-cli-x"
version = "0.0.5-beta.2"
edition = "2021"
rust-version = "1.80"
description = "Single-binary CLI that lets AI agents on different machines run commands and edit files on each other"
license = "MIT"
repository = "https://github.com/Fracizz/agent-cli-x"

[[bin]]
name = "agent-cli-x"
path = "src/main.rs"

[dependencies]
# TLS：只用 ring 后端，不依赖 OpenSSL，便于静态链接
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
dunce = "1"
regex = "1"
encoding_rs = "0.8"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Networking_WinSock",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
